<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Rolando Duarte — Full Stack Developer</title>
  <desc id="desc">Banner profesional para el perfil de GitHub de Rolando Duarte</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="52%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="70" r="210" fill="url(#glow)"/>
  <circle cx="1160" cy="270" r="150" fill="url(#glow)" opacity="0.6"/>

  <g opacity="0.16" stroke="#38bdf8" fill="none">
    <path d="M860 38h96l42 42h126"/>
    <path d="M930 110h84l38 38h142"/>
    <path d="M900 184h110l38 38h118"/>
    <circle cx="859" cy="38" r="4" fill="#38bdf8"/>
    <circle cx="929" cy="110" r="4" fill="#38bdf8"/>
    <circle cx="899" cy="184" r="4" fill="#38bdf8"/>
  </g>

  <rect x="76" y="66" width="88" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="76" y="132" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="50" font-weight="700">Rolando Duarte</text>
  <text x="76" y="177" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23">Full Stack Developer · Web · APIs · SaaS · Mobile</text>
  <text x="76" y="225" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">React · Node.js · PostgreSQL · Prisma · MongoDB · React Native</text>

  <g transform="translate(76 253)">
    <rect width="420" height="34" rx="17" fill="#0b1220" stroke="#1e293b"/>
    <circle cx="20" cy="17" r="5" fill="#22c55e"/>
    <text x="35" y="23" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Construyendo productos reales, mantenibles y escalables</text>
  </g>
</svg>
